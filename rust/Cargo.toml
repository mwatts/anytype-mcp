[package]
name = "anytype-mcp-rust"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Anytype MCP Contributors"]
description = "Anytype MCP Server implementation in Rust"
license = "MIT"
repository = "https://github.com/anyproto/anytype-mcp"
keywords = ["anytype", "mcp", "api", "server"]

[[bin]]
name = "anytype-mcp"
path = "src/main.rs"

[dependencies]
# Official Rust MCP SDK
rmcp = { version = "3.1", features = ["server", "transport-io"] }

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client
reqwest = { version = "0.13", features = ["json", "multipart", "stream", "query"] }

# OpenAPI
openapiv3 = "2.2"
serde_yaml = "0.9.34"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
url = "2.5"
base64 = "0.23"

# Configuration
figment = { version = "0.10", features = ["toml", "json", "env"] }
